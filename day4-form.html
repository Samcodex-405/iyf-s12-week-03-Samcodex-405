<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive contact form styling exercise.">
    <title>Day 4 — Contact Form Styling</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="form-styling-page">
    <main class="form-wrapper">
        <header class="form-header">
            <h1>Get in touch</h1>
            <p>Have a question or a project in mind? Send me a message using the form below.</p>
        </header>

        <form class="contact-form" action="#" method="post">
            <div class="form-field">
                <label for="full-name">Full name</label>
                <input
                    type="text"
                    id="full-name"
                    name="fullName"
                    placeholder="e.g. Shaniz Ann Mumbua"
                    autocomplete="name"
                    minlength="2"
                    required
                >
            </div>

            <div class="form-field">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-field">
                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="What is your message about?"
                    minlength="3"
                    required
                >
            </div>

            <div class="form-field">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    minlength="10"
                    required
                ></textarea>
                <p class="field-hint">Please write at least 10 characters.</p>
            </div>

            <button class="form-submit" type="submit">Send message</button>
            <p class="form-note">This is a front-end practice form; it does not send messages to a server.</p>
        </form>
    </main>
</body>
</html>
